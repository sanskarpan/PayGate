global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = p1
      receiver: 'p1-critical'
      group_wait: 10s
      repeat_interval: 30m

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:9999/alerts'
        send_resolved: true

  - name: 'p1-critical'
    webhook_configs:
      - url: 'http://localhost:9999/alerts/critical'
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = p1
    target_matchers:
      - severity = p2
    equal: ['alertname']
