#   kubectl -n paygate create secret generic paygate-secrets \
#     --from-literal=DATABASE_URL='postgres://user:pass@host:5432/paygate?sslmode=require' \
#     --from-literal=DASHBOARD_SESSION_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=PAYOUT_RAIL_SECRET="$(openssl rand -base64 32)" \
