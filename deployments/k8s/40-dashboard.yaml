apiVersion: apps/v1
kind: Deployment
metadata:
  name: paygate-dashboard
  namespace: paygate
  labels:
    app.kubernetes.io/name: paygate
    app.kubernetes.io/component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: paygate
      app.kubernetes.io/component: dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paygate
        app.kubernetes.io/component: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/sanskarpan/paygate/dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            # The browser posts the login form straight to the API and follows
            # its redirect, so API_BASE_URL must be the PUBLIC API URL, not the
            # in-cluster Service name. It must also match DASHBOARD_ORIGIN on
            # the API side or the session cookie will not be sent back.
            - name: API_BASE_URL
              value: "https://api.paygate.example.com"
            # Server-side rendering talks to the API directly over the cluster
            # network, avoiding a hairpin out through the ingress.
            - name: API_INTERNAL_BASE_URL
              value: "http://paygate-api-gateway.paygate.svc.cluster.local"
            - name: APP_BASE_URL
              value: "https://dashboard.paygate.example.com"
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: paygate-config
                  key: TZ
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: paygate-dashboard
  namespace: paygate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paygate
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
